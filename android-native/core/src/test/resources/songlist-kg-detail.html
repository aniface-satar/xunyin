<script type="text/javascript">
	// 绑定列表数据
	function bindList() {
		if(global.data){
			document.getElementById("specialWrap").innerHTML = template.render('list', {
				kg_domain: global.kg_domain,
				data: global.data,
				version: global.ver
			});
		}
	}
	template.helper('$format', function(d) {
		if (d >= 10000) {
			d = d / 10000;
			var i = d.toString().indexOf(".");
			if (i == -1) {
				return d + "万";
			} else {
				return d.toString().substring(0, i + 2) + "万";
			}
		} else {
			return d;
		}
	});
	template.helper('$replace', function(str, target, value) {
		str = str.replace(target, value);
		return str;
	});
	</script>
