name: Native build (B0 skeleton)

on:
  push:
    branches:
      - dev
    paths:
      - 'android-native/**'
      - '.github/workflows/native-build.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'android-native/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (caching + summary)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint Kotlin (ktlint)
        run: ./gradlew ktlintCheck --stacktrace

      - name: Build debug APK (verification)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xunyin-native-apk
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
